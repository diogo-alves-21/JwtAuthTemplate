version: "3.9"
name: "jwt"

services:
  db:
    image: postgres:latest
    container_name: java_postgres
    restart: always
    environment:
      POSTGRES_DB: jwtAppDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - ..:/workspace

